[pytest]
# Custom markers
markers =
    validate_csv: Tests to validate CSV file schema
    smoke: Quick smoke/basic functionality tests
    regression: Regression tests
    integration: Integration tests
    performance: Performance tests
    critical: Critical tests
    unmarked: Tests with no explicit markers

# Test discovery settings - only look for files prefixed with test_
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# HTML report generation
addopts = --html=reports/report.html --self-contained-html -v

# Logging
log_cli = true
log_cli_level = INFO